# Checks every push to main and every pull request: the typecheck, the unit tests and the end-to-end tests with real
# TeX (Tectonic and BasicTeX's latexmk), and a stable build of the desktop app, kept as a workflow artifact.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: TeX
        run: |
          brew install tectonic
          brew install --cask basictex
          echo /Library/TeX/texbin >> "$GITHUB_PATH"
          sudo /Library/TeX/texbin/tlmgr update --self
          sudo /Library/TeX/texbin/tlmgr install latexmk

      # The packages Tectonic fetches on its first build.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/Library/Caches/Tectonic
          key: tectonic-${{ runner.os }}-${{ hashFiles('examples/**', 'tests/**', 'e2e/**') }}
          restore-keys: tectonic-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      # Electrobun's SDK, which the typecheck reads, comes from its own toolchain, not from npm.
      - run: bun run app:prepare
      - run: bun run typecheck
      - run: bun test tests

      # Mirador's canvas code (MIT), for the e2e tests that frame the view in WebKit as Mirador frames it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: sodre90/mirador
          ref: 645d82aba6a719522ba3c2b8579322ff08eceded # v0.12.0
          path: .mirador
          sparse-checkout: shared
      - run: bunx playwright-core install webkit

      # Builds the Mirador plugin's view, then runs it in the runner's Chrome, and in WebKit framed as Mirador frames it.
      - run: bun run e2e
        env:
          MIRADOR_CANVAS: ${{ github.workspace }}/.mirador/shared/canvas-document.ts

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun run app:prepare
      - run: bun run app:build

      # Not for a fork's pull request, so no DMG built from outside code sits on this repository's Actions page.
      - if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: NeoManuscript-${{ github.sha }}
          path: artifacts/*.dmg
          retention-days: 7
