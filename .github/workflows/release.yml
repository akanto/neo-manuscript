# Builds the desktop app for a version tag (v0.2.0) and publishes it as the latest GitHub release: the DMG to install,
# and the files the installed apps update from (see release.baseUrl in electrobun.config.ts).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    # Apple silicon.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # Mirador's plugin store installs the plugin at the tag, and checks that plugin.json's version is the tag's.
      - name: The tag is package.json's and plugin.json's version
        run: |
          for file in package.json plugin.json; do
            version="v$(jq -r .version "$file")"
            if [ "$version" != "$GITHUB_REF_NAME" ]; then
              echo "The tag $GITHUB_REF_NAME isn't $file's version, $version." >&2
              exit 1
            fi
          done

      - run: bun install --frozen-lockfile
      # Electrobun's SDK, which the typecheck reads and the build uses, comes from its own toolchain, not from npm.
      - run: bun run app:prepare
      - run: bun run typecheck
      - run: bun test tests

      # Electrobun fetches the latest release's update.json to make a patch from it to this version, so that installed
      # apps download only what changed.
      - name: Build
        run: bun run app:build

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "NeoManuscript ${GITHUB_REF_NAME#v}" \
            --notes "To install, download **macos-arm64-NeoManuscript.dmg**. The other files are for the app's automatic updates." \
            --generate-notes \
            --latest
